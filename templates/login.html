{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="auth-wrap">
    <div class="form-card">
        <div class="form-icon">👋</div>
        <h1>Welcome back</h1>
        <p class="muted">Log in to see your career dashboard.</p>
        <form method="POST" autocomplete="on">
            <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" placeholder="you@example.com" value="{{ form.get('email', '') }}" required autofocus>
            <label for="password">Password</label>
            <div class="pw-field">
                <input id="password" name="password" type="password" placeholder="Your password" required>
                <button type="button" class="pw-toggle" data-target="password">Show</button>
            </div>
            <button class="btn full" type="submit">Log in</button>
        </form>
        <p class="center muted">New here? <a href="{{ url_for('auth.register') }}">Create an account</a></p>
    </div>
</div>
{% endblock %}
