{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="auth-wrap">
    <div class="form-card">
        <div class="form-icon">🚀</div>
        <h1>Create your account</h1>
        <p class="muted">It takes under a minute. Then you pick your skills.</p>
        <form method="POST" autocomplete="on">
            <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
            <label for="name">Full name</label>
            <input id="name" name="name" type="text" maxlength="60" placeholder="Your name" value="{{ form.get('name', '') }}" required autofocus>
            <label for="email">Email</label>
            <input id="email" name="email" type="email" placeholder="you@example.com" value="{{ form.get('email', '') }}" required>
            <label for="password">Password</label>
            <div class="pw-field">
                <input id="password" name="password" type="password" minlength="6" placeholder="Minimum 6 characters" required>
                <button type="button" class="pw-toggle" data-target="password">Show</button>
            </div>
            <div class="strength" id="strength" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
            <small class="muted" id="strengthLabel">Use letters, numbers and symbols for a stronger password.</small>
            <label for="confirm">Confirm password</label>
            <input id="confirm" name="confirm" type="password" placeholder="Type it again" required>
            <button class="btn full" type="submit">Create account</button>
        </form>
        <p class="center muted">Already have an account? <a href="{{ url_for('auth.login') }}">Log in</a></p>
    </div>
</div>
{% endblock %}
